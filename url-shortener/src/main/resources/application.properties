spring.application.name=url-shortener
# -------------------------------------------------
#  Datasource / JPA
# -------------------------------------------------
#
spring.datasource.url=jdbc:postgresql://${POSTGRES_SERVER:db}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tinylsdb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------
#  Cache Configuration (Redis)
# -------------------------------------------------
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.cache.redis.time-to-live=3600s
spring.data.redis.timeout=2000ms
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=tinyls:
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms


# -------------------------------------------------
#  Server Configuration
# -------------------------------------------------
server.port=8000
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.forward-headers-strategy: native

# -------------------------------------------------
#  Spring MVC Configuration
# -------------------------------------------------
spring.web.resources.add-mappings=false

# -------------------------------------------------
#  OpenAPI / Swagger Configuration
# -------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

# -------------------------------------------------
#  Logging Configuration
# -------------------------------------------------
logging.level.root=INFO
logging.level.com.tinyls.urlshortener=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# -------------------------------------------------
#  Security Configuration
# -------------------------------------------------
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin}
# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid, email, profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# GitHub OAuth2 Configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=True

# Frontend URL Configuration
frontend.url=${FRONTEND_URL:https://staging.tinyls.com}

# JWT Configuration
app.jwt.secret=${SECRET_KEY:your-256-bit-secret}
app.jwt.expiration=86400000

# -------------------------------------------------
#  Flyway Configuration
# -------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# -------------------------------------------------
#  URL Title Extraction Configuration
# -------------------------------------------------
# Enable/disable automatic title extraction from URLs
url.title.extraction.enabled=true
# Timeout for HTTP requests in milliseconds
url.title.extraction.timeout=5000
# Maximum content length to process for title extraction
url.title.extraction.max-content-length=50000
# Maximum number of threads for async title extraction
url.title.extraction.max-threads=5
# Enable fallback to meta description if title not found
url.title.extraction.fallback-to-description=false
# Enable Open Graph title extraction
url.title.extraction.use-open-graph=false
# User agent string for title extraction requests
url.title.extraction.user-agent=tinyls-URL-Title-Extractor/1.0

# -------------------------------------------------
#  Actuator Configuration
# -------------------------------------------------
management.endpoints.web.exposure.include: health,info,caches
management.endpoint.health.show-details: always
management.endpoint.mongodb.enabled: false

# -------------------------------------------------
#  Feature Flags Configuration
# -------------------------------------------------
# All feature flags default to false for safety
# Enable features by setting them to true in environment-specific configs
features.redirect-cache=true
features.password-links=false
features.advanced-analytics=false
features.url-expiration=false
features.custom-domains=false
features.bulk-operations=false
features.url-preview=false
features.user-rate-limiting=false
features.url-categorization=false
features.social-media-integration=false
features.url-health-monitoring=false
features.advanced-security=false
features.api-rate-limiting=false
features.detailed-click-tracking=false
features.url-backup-restore=false
features.custom-share-messages=false
features.performance-optimization=false